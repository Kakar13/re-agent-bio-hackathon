[project]
name = "re-agent-bio-hackathon"
version = "0.1.0"
description = "re:AGENT hackathon project — scientific agents, datasets, and biological design"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[project.optional-dependencies]
proto = [
    "proto-client>=0.1.0",
    "proto-tools",
    "proto-language",
    "modal",
]
immuno = [
    "mhcflurry>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "benchling-sdk>=1.25.0",
    "torch>=2.0.0",
]
pda = [
    "biopython>=1.83",
    "biotite>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
]
dev = ["ruff>=0.12.0", "pytest>=8.0.0"]

[tool.uv]
package = false

[tool.uv.sources]
proto-tools = { git = "https://github.com/evo-design/proto-tools.git" }
proto-language = { git = "https://github.com/evo-design/proto-language.git" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

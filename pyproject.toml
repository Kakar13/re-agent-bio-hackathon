[project]
name = "re-agent-bio-hackathon"
version = "0.1.0"
description = "re:AGENT hackathon project — scientific agents, datasets, and biological design"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "langgraph>=1.2.11",
    "langchain-anthropic>=1.5.6",
    "langsmith>=0.11.0",
    "langgraph-cli[inmem]>=0.4.31",
    "langchain-mcp-adapters>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
proto = [
    "proto-client>=0.1.0",
    "proto-tools[mcp]",
    "proto-language",
    "modal",
]
ml = [
    "torch>=2.4.0",
    "fair-esm>=2.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "datasets>=3.0.0",
    "requests>=2.32.0",
]
e2e_pls = [
    "modal>=0.68",
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "streamlit>=1.38",
    "plotly>=5.24",
    "fair-esm>=2.0.0",
]
e2e_pls_data = [
    "mhcflurry>=2.2",
    "biopython>=1.83",
]
dev = ["ruff>=0.12.0", "pytest>=8.0"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/re_agent"]

[tool.uv.sources]
proto-tools = { git = "https://github.com/evo-design/proto-tools.git" }
proto-language = { git = "https://github.com/evo-design/proto-language.git" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
